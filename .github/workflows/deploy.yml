name: Deploy

# main is green in CI → build the arm64 image of that exact commit → ECR (getpack/web:sha-xxxxxxx + :uat)
# → deploy to the UAT box (web container → health check → automatic rollback on failure).
# NEXT_PUBLIC_* are inlined at build time, so this image is UAT-only; production web is built from a
# release tag with production build args. Pipeline and box scripts: Collective-Group-Thailand/collective-infra.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

concurrency:
  group: deploy-uat
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: Collective-Group-Thailand/collective-infra/.github/workflows/reusable-build-push.yml@v1
    with:
      image: getpack/web
      environment: uat
      moving_tag: uat
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Public values only (they end up in the browser bundle). Hosts mirror collective-infra
      # platform/caddy/sites.uat.yml; the container gets the same values at run time.
      build_args: |
        PUBLIC_HOST=uat.getpack.co
        ADMIN_HOST=admin-uat.getpack.co
        PARTNER_HOST=partner-uat.getpack.co
        NEXT_PUBLIC_ENV_BADGE=uat

  deploy:
    needs: build
    uses: Collective-Group-Thailand/collective-infra/.github/workflows/reusable-deploy.yml@v1
    with:
      product: getpack
      component: web
      environment: uat
      image_tag: ${{ needs.build.outputs.image_tag }}
      migrate: false
