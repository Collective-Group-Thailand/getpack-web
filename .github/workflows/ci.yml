name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # `next build` and `next start` run with NODE_ENV=production, where the env schema has no
  # defaults on purpose (src/lib/env/schema.ts). Supplying real values here keeps validation
  # **on** in CI, so the schema is exercised rather than skipped.
  PUBLIC_HOST: "localhost:3000"
  ADMIN_HOST: "admin.localhost:3000"
  PARTNER_HOST: "partner.localhost:3000"
  API_INTERNAL_URL: "http://127.0.0.1:4999"
  # `next build` type-checks the whole app and outgrows Node's default heap on the runner.
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # The generated CSS is committed, so a hand edit or a forgotten `pnpm tokens` after a
      # token change must fail here rather than ship a stylesheet nobody can reproduce.
      - name: Design tokens are up to date
        run: pnpm tokens:check

      - name: Typecheck (app)
        run: pnpm typecheck

      - name: Typecheck (@getpack/dieline)
        run: pnpm --filter @getpack/dieline typecheck

      # Includes the WCAG 2.2 AA contrast gate over every semantic token pair in all three
      # themes (ADR-0003) and axe over every component.
      - name: Unit tests (app)
        run: pnpm test:app

      - name: Unit tests (@getpack/dieline)
        run: pnpm test:dieline

      # Thumbnails and dieline SVGs are build output; the manifest of their hashes is committed.
      # A recipe change without a re-render, or a render that is not reproducible, fails here.
      - name: Style assets are reproducible (U3.3)
        run: pnpm styles:render:check

      - name: Build the publishable package
        run: pnpm build:packages

      - name: Build
        run: pnpm build

      - name: Release hygiene (no mock or debug traces in the build)
        run: pnpm release:hygiene

  contract:
    name: contract (no drift from getpack-api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates from the vendored contract/openapi.json — whose sha256 the script checks
      # against contract.lock.json — and fails if any committed output differs. Adopting a
      # newer (tagged) backend contract is `pnpm gen:api --adopt --tag vX.Y.Z`, which rewrites the vendored copy and
      # the lock together, so it shows up in the diff of a PR rather than in a build.
      - name: Generated API surface is up to date
        run: pnpm gen:api:check
      # decisions.md and api-conventions.md are getpack-api's: synced at the pinned tag, never edited here.
      - name: Shared docs match getpack-api
        run: pnpm docs:sync:check

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: storybook-static/
          retention-days: 7

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  step-counters:
    name: step counters (scorecard T1–T12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Blocking since U5.8 (docs/prompts/U5-ux-excellence.md): a journey over its step budget
    # without a known exception (competitive-scorecard.md §5), above its exception's ceiling, back
    # within budget while still excepted, not walkable, or meeting a required field the scorecard
    # does not list fails the job.
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The reporter appends the step table to the job summary (e2e/journeys/reporter.ts).
      - name: Step counters
        run: pnpm e2e:journeys
        env:
          STEP_BUDGETS: enforce

      # The studio's 3D orbit under a 4× CPU throttle, alone on the runner (U4.3). Still advisory:
      # U5.8 makes the step counters a gate, not this measurement.
      - name: Studio performance
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm e2e:perf

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: step-counts
          path: test-results/journeys/
          retention-days: 30

  lighthouse:
    name: lighthouse (performance budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # One run per URL set (docs/performance-budgets.md), against a single mock-mode server
      # that answers all three hosts — see scripts/lhci.ts. Resource-size and a11y assertions
      # are errors; the field-metric ones are warnings, because a shared runner cannot stand
      # in for a p75 measurement honestly — Web Vitals RUM is the real signal.
      #
      # The script-size assertions are ratchets pinned above today's measurements, not the
      # documented budgets: every route type is currently over, and the gap is recorded in
      # docs/performance-budgets.md rather than absorbed by relaxing the target.
      - name: Lighthouse CI
        run: pnpm lhci

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  visual:
    name: visual snapshots (storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Not blocking yet: the committed baselines are macOS, and text rasterises differently on
    # Linux, so every shot would differ for a reason that is not a regression. Generate the
    # Linux set once on this runner — `pnpm e2e:visual:update`, download the artifact below,
    # commit `e2e/__screenshots__/linux/` — then delete this line and the job becomes a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Visual snapshots
        run: pnpm e2e:visual

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-diffs
          path: |
            test-results/
            e2e/__screenshots__/
          retention-days: 7

# Added later:
#   Storybook visual snapshots run on CI's Linux runner only, and need their baselines
#   generated once there — see the `visual` project in playwright.config.ts.
