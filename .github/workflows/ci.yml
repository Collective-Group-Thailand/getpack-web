name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # `next build` and `next start` run with NODE_ENV=production, where the env schema has no
  # defaults on purpose (src/lib/env/schema.ts). Supplying real values here keeps validation
  # **on** in CI, so the schema is exercised rather than skipped.
  PUBLIC_HOST: "localhost:3000"
  ADMIN_HOST: "admin.localhost:3000"
  PARTNER_HOST: "partner.localhost:3000"
  API_INTERNAL_URL: "http://127.0.0.1:4999"

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # The generated CSS is committed, so a hand edit or a forgotten `pnpm tokens` after a
      # token change must fail here rather than ship a stylesheet nobody can reproduce.
      - name: Design tokens are up to date
        run: pnpm tokens:check

      - name: Typecheck (app)
        run: pnpm typecheck

      - name: Typecheck (@packio/dieline)
        run: pnpm --filter @packio/dieline typecheck

      # Includes the WCAG 2.2 AA contrast gate over every semantic token pair in all three
      # themes (ADR-0003) and axe over every component.
      - name: Unit tests (app)
        run: pnpm test:app

      - name: Unit tests (@packio/dieline)
        run: pnpm test:dieline

      - name: Build the publishable package
        run: pnpm build:packages

      - name: Build
        run: pnpm build

  contract:
    name: contract (no drift from packio-api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates from the vendored contract/openapi.json — whose sha256 the script checks
      # against contract.lock.json — and fails if any committed output differs. Adopting a
      # newer backend contract is `pnpm gen:api --adopt`, which rewrites the vendored copy and
      # the lock together, so it shows up in the diff of a PR rather than in a build.
      - name: Generated API surface is up to date
        run: pnpm gen:api:check

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: storybook-static/
          retention-days: 7

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: lighthouse (performance budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # One run per URL set (docs/performance-budgets.md), against a single mock-mode server
      # that answers all three hosts — see scripts/lhci.ts. Resource-size and a11y assertions
      # are errors; the field-metric ones are warnings, because a shared runner cannot stand
      # in for a p75 measurement honestly — Web Vitals RUM is the real signal.
      #
      # The script-size assertions are ratchets pinned above today's measurements, not the
      # documented budgets: every route type is currently over, and the gap is recorded in
      # docs/performance-budgets.md rather than absorbed by relaxing the target.
      - name: Lighthouse CI
        run: pnpm lhci

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  visual:
    name: visual snapshots (storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Not blocking yet: the committed baselines are macOS, and text rasterises differently on
    # Linux, so every shot would differ for a reason that is not a regression. Generate the
    # Linux set once on this runner — `pnpm e2e:visual:update`, download the artifact below,
    # commit `e2e/__screenshots__/linux/` — then delete this line and the job becomes a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Visual snapshots
        run: pnpm e2e:visual

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-diffs
          path: |
            test-results/
            e2e/__screenshots__/
          retention-days: 7

# Added later:
#   Storybook visual snapshots run on CI's Linux runner only, and need their baselines
#   generated once there — see the `visual` project in playwright.config.ts.
