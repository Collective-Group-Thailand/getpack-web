name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck (app)
        run: pnpm typecheck

      - name: Typecheck (@packio/dieline)
        run: pnpm --filter @packio/dieline typecheck

      - name: Unit tests (app)
        run: pnpm test:app

      - name: Unit tests (@packio/dieline)
        run: pnpm test:dieline

      - name: Build the publishable package
        run: pnpm build:packages

      - name: Build
        run: pnpm build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# Added later, per docs/prompts/F0-setup.md:
#   F0.2 — Storybook build and the token contrast gate, Lighthouse CI with the budgets
#          in docs/performance-budgets.md
#   F1   — contract drift: `pnpm gen:api` must leave src/lib/api/schema.d.ts unchanged
